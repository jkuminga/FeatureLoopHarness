  FEATURE_PREPARE_REQUEST:
    strong:
      - 기능.*준비
      - feature.*prepare
      - backlog
      - 기능.*디렉토리.*생성
    aliases:
      - 이.*기능.*준비
      - 기능.*작업.*준비
      - 기능.*문서.*공간
      - feature.*workspace
      - 작업.*대상.*올
      - 기능.*ready
      - feature-index.*추가.*준비

  FEATURE_DESIGN_REQUEST:
    strong:
      - 기능.*설계
      - SPEC\.md
      - CHECKLIST\.md
      - TEST_CASES\.md
      - 기능.*스펙
    aliases:
      - 이.*기능.*설계
      - 기능.*스펙.*작성
      - SPEC.*작성
      - 체크리스트.*만들
      - 테스트.*케이스.*정리
      - 구현.*전.*기능.*문서
