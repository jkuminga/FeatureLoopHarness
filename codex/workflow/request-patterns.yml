      - 기능.*범위.*정리
      - 기능.*완료.*기준

  MVP_DESIGN_REQUEST:
    strong:
      - \bmvp\b
      - MVP
      - 엠브이피
      - 최소.*제품
      - 최소.*범위
    aliases:
      - 초기.*범위.*정리
      - 1차.*출시.*범위
      - 핵심.*범위
      - 어디까지.*만들
      - 가장.*먼저.*만들
      - 필수.*기능.*추
      - 첫.*버전.*범위
      - 프로젝트.*목표.*정리
      - 타겟.*사용자.*정리
      - 해결.*문제.*정리

  ARCHITECTURE_DESIGN_REQUEST:
