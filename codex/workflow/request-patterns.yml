      - 라우트.*구조
      - 서버.*API.*설계
      - 백엔드.*API.*설계
      - API.*계약

  FRONTEND_DESIGN_REQUEST:
    strong:
      - 프론트
      - frontend
      - FRONTEND
      - 디자인.*지침
      - UI.*지침
    aliases:
      - 화면.*설계
      - UI.*방향
      - 프론트.*구조
      - 화면.*흐름
      - 페이지.*구성
      - 사용자.*플로우
      - 디자인.*가이드
      - 컴포넌트.*방향
      - 레이아웃.*방향

  STATE_STATUS_REQUEST:
    strong:
      - 현재.*상태
      - 진행.*상황
      - 다음.*할
      - 남은.*작업
      - 요약
      - 상태.*알려
    aliases:
      - 어디까지.*됐
      - 현재.*단계
      - 뭐.*해야
      - 뭐부터.*하면
      - 다음.*작업.*추천

  STATE_TRANSITION_REQUEST:
    strong:
      - 다음.*단계
      - 전이
      - 상태.*변경
    aliases:
      - 다음.*단계.*넘어
      - 단계.*변경
      - 단계.*완료.*처리
      - workflow.*이동
      - 이.*단계.*끝
      - 다음.*상태.*바
