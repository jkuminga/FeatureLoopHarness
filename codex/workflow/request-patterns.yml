version: 1

patterns:
  PRISMA_BASELINE_CREATE_REQUEST:
    strong:
      - prisma.*baseline
      - baseline.*prisma
      - schema\.prisma
      - 프리즈마.*베이스라인
      - 프리즈마.*생성
      - prisma.*생성
