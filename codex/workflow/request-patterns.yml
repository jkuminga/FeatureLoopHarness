      - 아키텍처
      - 아키텍쳐
      - architecture
      - 시스템.*구조
    aliases:
      - 전체.*구조
      - 기술.*구조
      - 프로젝트.*구조
      - 폴더.*구조
      - 모듈.*구조
      - 레이어.*구조
      - 서비스.*구성
      - 백엔드.*프론트.*연결

  FEATURE_INDEX_REQUEST:
    strong:
      - feature-index
      - 기능.*목록
      - 기능.*리스트
      - Feature Index
    aliases:
      - 필요한.*기능.*정리
      - 구현할.*기능.*뽑
      - 기능.*리스트업
      - 기능.*우선순위
      - 기능.*인덱스
      - MVP.*기능.*나
      - 기능.*단위.*쪼
      - 작업할.*기능.*정리

  DATA_MODEL_DESIGN_REQUEST:
    strong:
      - 데이터.*모델
      - DB_SCHEMA
      - ERD
      - E-R
      - 엔티티
      - schema
    aliases:
      - 데이터.*구조
      - 테이블.*구조
      - DB.*구조
      - ER.*구조
      - 관계.*정의
      - 스키마.*초안
      - 도메인.*모델
      - 저장.*데이터
      - Prisma.*모델.*방향

  API_DESIGN_REQUEST:
    strong:
      - \bAPI\b
      - api
      - 엔드포인트
      - endpoint
