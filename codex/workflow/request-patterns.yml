      - 이.*기능.*구현
      - 개발.*시작
      - 코드.*반영
      - 실제.*코드.*작성
      - 앱.*반영
      - 기능.*붙
      - 화면.*만들
      - API.*만들
      - 컴포넌트.*만들
      - 로직.*작성
      - 수정.*반영

  TEST_REQUEST:
    strong:
      - 테스트.*작성
      - 테스트.*실행
      - e2e
      - unit test
      - 유닛
    aliases:
      - 테스트.*만들
      - 테스트.*추가
      - 검증해
      - 테스트.*돌
      - E2E.*만들
      - 유닛.*테스트.*만들
      - 통합.*테스트.*작성
      - 테스트.*케이스.*코드

  COMMIT_REQUEST:
    strong:
      - 커밋
      - commit
      - push
      - 푸쉬
      - merge
      - 머지
