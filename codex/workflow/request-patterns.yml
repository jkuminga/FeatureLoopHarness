      - DB.*baseline.*생성
      - 초기.*migration
      - baseline.*migration
      - Prisma.*migration.*준비

  IMPLEMENTATION_REQUEST:
    strong:
      - 구현해
      - 코드.*작성
      - 컴포넌트.*만들
      - api.*구현
      - 파일.*수정
      - 앱.*수정
      - 작업.*진행
